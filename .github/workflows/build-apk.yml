name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets Folder
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          else
            echo "<h1>TM26</h1>" > www/index.html
          fi

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "com.tacticalmanager.app",
            "appName": "TM26",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      - name: Install Capacitor CLI & Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

      - name: Fix Kotlin Version Mismatch
        run: |
          echo "
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }" >> android/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force Overwrite Custom App Icon
        run: |
          if [ -f "icon.png" ]; then
            RES_DIR="android/app/src/main/res"
            
            find "$RES_DIR" -name "ic_launcher.xml" -delete
            find "$RES_DIR" -name "ic_launcher_round.xml" -delete
            
            for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "$RES_DIR/$folder"
              cp icon.png "$RES_DIR/$folder/ic_launcher.png"
              cp icon.png "$RES_DIR/$folder/ic_launcher_round.png"
              cp icon.png "$RES_DIR/$folder/ic_launcher_foreground.png"
            done
            
            echo "Egyedi ikon sikeresen rákényszerítve az APK-ra!"
          fi

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      # Itt átnevezzük az elkészült APK fájlt tm26.apk-ra!
      - name: Rename APK File
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/tm26.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tm26-apk
          path: android/app/build/outputs/apk/debug/tm26.apk
